[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-research-agent"
version = "0.1.0"
description = "An evidence-grounded, tool-directed scientific research assistant"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3", "openai>=2,<3", "pymupdf>=1.24,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
research-agent = "research_agent.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
